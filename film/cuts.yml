# Нарезки одного журнала дубля (src/cuts.ts, src/release.ts): кому ролик, из каких частей, сколько
# секунд и что говорит голос (он же субтитры). Часть - клип журнала (имя файла без расширения:
# шаг-номер-участник или шаг-чат) или слайд (film/slides/<имя>.png из Claude Design: как устроена
# фабрика, способы работы, роли, инструменты). from - с какой секунды клипа: по умолчанию первый клип
# шага с главой - после карточки главы, 0 - с карточкой, меньше нуля - от конца клипа (холст Figma
# рисуется долго); seconds - сколько показывать, голос длиннее - последний кадр держится.
# Роли в голосе называются полностью: владелец продукта, менеджер проекта, архитектор, дизайнер,
# фронтенд- и бэкенд-разработчик, тестировщик, DevOps.
# Правка нарезок - перевыпуск из журнала без нового дубля (scripts/demo-release.sh).
voice: ru-RU-SvetlanaNeural

cuts:
  investor:
    title: Фабрика ПО на ИИ - от требования до выкладки
    audience: для инвестора
    max: 330
    intro_say: Фабрика ПО на ИИ ведёт изменение от требования до выкладки. Люди принимают решения, ИИ-агенты делают рутинную работу.
    parts:
      - { slide: factory, seconds: 14, say: "Фабрика подключается к инструментам команды: трекеру задач, вики, чату и репозиторию. Она отвечает на вопросы по знаниям проекта, нарезает требования на задачи, пишет код и тесты, проверяет каждое изменение, выкладывает его на стенд и ведёт учёт времени и стоимости." }
      - { slide: modes, seconds: 16, say: "Роль в команде может держать человек, человек со своими ИИ-помощниками или ИИ-агент, а один человек может держать несколько ролей. Фабрика работает при любом составе: от обычной команды до одного предпринимателя, у которого остальные роли играет ИИ." }
      - { slide: process, seconds: 16, say: "На реальном проекте решения принимают люди: утвердить нарезку, слить изменение, выложить выпуск. Кто какое решение может принять, задаёт реестр ролей в репозитории проекта. Рутину делают агенты фабрики. В этом демо роли людей тоже играют ИИ-персонажи, чтобы прогон повторялся одной командой." }
      - { clip: librarian-chat, seconds: 10, say: "Владелец продукта спрашивает фабрику прямо в чате. Библиотекарь отвечает по знаниям проекта и называет источники." }
      - { clip: story-2-po, seconds: 10, say: "Владелец продукта пишет требование в Confluence. Сверщик фабрики сам находит противоречие с архитектурным решением." }
      - { clip: adr-1-architect, seconds: 10, say: "Архитектор уточняет решение и добавляет правило-страж. Право менять настройки фабрики ему даёт реестр ролей." }
      - { clip: slice-chat, seconds: 9, say: "Менеджер проекта просит фабрику нарезать требование на задачи. Фабрика предлагает задачи с оценками." }
      - { clip: approve-chat, seconds: 6, say: "Утверждает нарезку владелец продукта - это решение его роли." }
      - { clip: design-1-designer, from: -6, seconds: 6, say: "Дизайнер выгружает макет экрана из Figma и просит фабрику сверить его с задачей." }
      - { clip: design-2-designer, seconds: 8, say: "Судья макета - модель другого семейства - находит, чего не хватает: состояний после повтора и при ошибке." }
      - { clip: design-v2-1-designer, from: -6, seconds: 6, say: "Дизайнер дорисовывает эти состояния и объясняет проверку итогов словами пользователя." }
      - { clip: design-v2-2-designer, seconds: 6, say: "Повторная сверка: макет соответствует задаче." }
      - { clip: frontend-1-frontend, seconds: 8, say: "Фронтенд-разработчик отдаёт экран агенту фабрики. Агент роли фронтенда меняет только веб-часть." }
      - { clip: agent-2-backend, seconds: 10, say: "Бэкенд-разработчик отдаёт свою задачу агенту бэкенда. Агент пишет код и тесты на своём раннере, а страж, сканеры и тест до кода проверяют каждый PR." }
      - { clip: judge-1-backend, seconds: 8, say: "Вторая модель другого семейства судит изменение и пишет замечания." }
      - { clip: guard-1-backend, seconds: 8, say: "Правило из решения архитектора не пускает случайность в обход зерна. Вердикт красный, такой PR не слить." }
      - { clip: stand-3-po, seconds: 8, say: "Изменения выложены на стенд. Невостребованный приз разыгрывается заново, и проверка итогов сходится с зерном." }
      - { clip: crash-3-devops, seconds: 8, say: "Сбой на стенде сам становится багом с местом ошибки." }
      - { clip: bugfix-merge-1-devops, seconds: 8, say: "Агент исправляет баг, а после выкладки баг и сбой закрываются сами." }
      - { clip: impostor-chat, seconds: 8, say: "Самозванец без учётки пытается выложить выпуск. Фабрика отказывает по реестру ролей." }
      - { clip: released-1-devops, seconds: 7, say: "DevOps выкладывает выпуск, заметки собраны из работы этого прогона." }
      - { clip: account-chat, seconds: 8, say: "Менеджер проекта видит учёт: время агентов и стоимость каждой задачи." }
      - { slide: tools, seconds: 16, say: "Инструменты сменные. Фабрика работает с ними через порты: трекер, хостинг кода, задания агентов, чат, вики, макеты и сбои. Трекер и хостинг кода уже работают и на Forgejo, другой инструмент подключается новым адаптером. Стек самого проекта выбирает команда: команды проверок, правила и роли фабрика берёт из его репозитория." }

  # Весь процесс целиком: каждый шаг сценария по порядку, с карточками глав.
  full:
    title: Фабрика ПО на ИИ - весь процесс целиком
    audience: полный прогон
    max: 900
    intro_say: Фабрика ПО на ИИ - весь процесс целиком, от вопроса в чате до выпуска и учёта.
    parts:
      - { slide: factory, seconds: 14, say: "Фабрика подключается к инструментам команды: трекеру задач, вики, чату и репозиторию. Она отвечает на вопросы по знаниям проекта, нарезает требования на задачи, пишет код и тесты, проверяет каждое изменение, выкладывает его на стенд и ведёт учёт времени и стоимости." }
      - { slide: modes, seconds: 16, say: "Роль в команде может держать человек, человек со своими ИИ-помощниками или ИИ-агент, а один человек может держать несколько ролей. Фабрика работает при любом составе: от обычной команды до одного предпринимателя, у которого остальные роли играет ИИ." }
      - { slide: roles, seconds: 18, say: "В демо восемь ролей. Владелец продукта пишет требования и утверждает нарезку. Менеджер проекта просит нарезку и ведёт задачи и учёт. Архитектор принимает решения и правила. Дизайнер делает макеты. Фронтенд- и бэкенд-разработчики отдают задачи агентам и сливают изменения. Тестировщик гоняет проверки, DevOps выкладывает выпуски." }
      - { slide: process, seconds: 16, say: "На реальном проекте решения принимают люди: утвердить нарезку, слить изменение, выложить выпуск. Кто какое решение может принять, задаёт реестр ролей в репозитории проекта. Рутину делают агенты фабрики. В этом демо роли людей тоже играют ИИ-персонажи, чтобы прогон повторялся одной командой." }
      - { clip: librarian-chat, from: 0, seconds: 14, say: "Владелец продукта спрашивает фабрику в чате, что известно про невостребованные призы. Библиотекарь фабрики отвечает по правилам и решениям проекта и называет источники." }
      - { clip: story-1-po, from: 0, seconds: 8, say: "Владелец продукта пишет стори в Confluence: если победитель не подтвердил приз за три дня, приз разыгрывается заново." }
      - { clip: story-2-po, seconds: 9, say: "Фабрика сама заводит стори в Jira и сверяет её со знаниями проекта. Сверщик находит противоречие с архитектурным решением о честном розыгрыше." }
      - { clip: adr-1-architect, from: 0, seconds: 11, say: "Архитектор уточняет решение: повтор продолжает ту же последовательность из зерна. И добавляет правило-страж, которое запрещает другие источники случайности." }
      - { clip: adr-merge-1-po, seconds: 8, say: "После слияния решения противоречие в стори снимается само." }
      - { clip: slice-chat, seconds: 10, say: "Менеджер проекта просит фабрику нарезать стори на задачи. Фабрика предлагает задачи с оценками и сценариями приёмки." }
      - { clip: approve-chat, seconds: 7, say: "Владелец продукта утверждает нарезку, и фабрика заводит задачи." }
      - { clip: api-2-backend, seconds: 8, say: "Каждая задача - по одному шаблону: цель, сценарии приёмки, что вне рамок, основания." }
      - { clip: spec-1-backend, from: 0, seconds: 9, say: "Бэкенд-разработчик описывает изменение спецификацией OpenSpec. Слияние спецификации утверждает требования, и задача уходит агенту." }
      - { clip: agent-1-backend, from: 0, seconds: 8, say: "Агент бэкенда работает на своём раннере фабрики, а не в CI проекта." }
      - { clip: agent-2-backend, seconds: 10, say: "Агент открывает PR с кодом и тестами. Страж, сканеры и тест до кода проверяют его, вердикт стража зелёный." }
      - { clip: agent-3-pm, seconds: 7, say: "В задаче видно исполнителя и списанное время агента." }
      - { clip: judge-1-backend, seconds: 8, say: "Судья фабрики - модель другого семейства - оценивает изменение и пишет замечания." }
      - { clip: design-1-designer, from: -8, seconds: 8, say: "Дизайнер выгружает макет экрана из Figma и просит фабрику сверить его с задачей и правилами проекта." }
      - { clip: design-chat, seconds: 7, say: "Макет уходит судье макета прямо из чата." }
      - { clip: design-2-designer, seconds: 9, say: "Судья макета находит, чего не хватает: состояния после повтора, состояния при ошибке и объяснения проверки словами пользователя." }
      - { clip: design-v2-1-designer, from: -8, seconds: 8, say: "Дизайнер правит макет: дорисовывает оба состояния и переписывает объяснение." }
      - { clip: design-v2-chat, seconds: 7, say: "И просит фабрику сверить макет снова." }
      - { clip: design-v2-2-designer, seconds: 7, say: "Повторная сверка: макет соответствует задаче." }
      - { clip: frontend-1-frontend, from: 0, seconds: 10, say: "Фронтенд-разработчик отдаёт экран агенту фронтенда. Агент этой роли меняет только веб-часть и сквозные проверки." }
      - { clip: guard-1-backend, from: 0, seconds: 9, say: "Бэкенд-разработчик пробует перемешать участников без зерна. Правило из решения архитектора краснит такой PR, его не слить." }
      - { clip: ci-chat, from: 0, seconds: 9, say: "Тестировщик просит фабрику перезапустить проверки PR, итог приходит в канал." }
      - { clip: merge-1-pm, from: 0, seconds: 9, say: "Бэкенд-разработчик сливает PR агента. Фабрика выкладывает его на стенд, и задача закрывается сама." }
      - { clip: frontend-rework-1-frontend, from: 0, seconds: 10, say: "Фронтенд-разработчик просит в PR модульные тесты. Агент продолжает свою ветку и дописывает тесты, вердикт стража снова зелёный." }
      - { clip: verify-1-frontend, from: 0, seconds: 10, say: "В стори есть сценарий приёмки: после повтора проверка итогов сходится с зерном. Фронтенд-разработчик отдаёт эту задачу агенту, и страница учится пересчитывать повторный выбор." }
      - { clip: stand-1-po, from: 0, seconds: 7, say: "На стенде организатор проводит розыгрыш: победитель выбран из опубликованного зерна, на подтверждение приза - три дня." }
      - { clip: stand-2-po, seconds: 6, say: "Раньше срока повтор отклоняется - это правило проекта." }
      - { clip: stand-3-po, seconds: 8, say: "Через четыре дня приз не подтверждён, и организатор разыгрывает его заново." }
      - { clip: e2e-chat, seconds: 8, say: "Тестировщик запускает сквозные проверки на стенде, с того коммита, что выложен." }
      - { clip: crash-1-devops, from: 0, seconds: 6, say: "Клиент API отправляет заявку с несуществующей датой, и стенд падает." }
      - { clip: crash-2-devops, seconds: 7, say: "Сбой ловит GlitchTip." }
      - { clip: crash-3-devops, seconds: 7, say: "Фабрика сама заводит баг с событием сбоя и местом ошибки." }
      - { clip: bugfix-1-backend, from: 0, seconds: 9, say: "Менеджер проекта отдаёт баг агенту бэкенда. Агент присылает исправление с зелёным вердиктом стража." }
      - { clip: bugfix-merge-1-devops, seconds: 8, say: "После слияния и выкладки баг и сбой закрываются сами." }
      - { clip: rules-chat, from: 0, seconds: 8, say: "Архитектор трижды писал одно и то же замечание и просит фабрику найти повторы." }
      - { clip: rules-1-architect, seconds: 9, say: "Фабрика предлагает правило-кандидат: строку в правилах для агентов и проверку. Принимает его архитектор." }
      - { clip: notes-chat, from: 0, seconds: 9, say: "DevOps смотрит, что войдёт в выпуск: фабрика собирает заметки из коммитов, PR и задач." }
      - { clip: tag-chat, seconds: 8, say: "DevOps ставит тег, CI собирает образы выпуска." }
      - { clip: impostor-chat, from: 0, seconds: 9, say: "Самозванец без учётки пишет от имени DevOps и просит выложить выпуск. Фабрика отказывает: права решает роль учётки, а не имя." }
      - { clip: deploy-chat, from: 0, seconds: 8, say: "Настоящий DevOps подтверждает выкладку." }
      - { clip: released-1-devops, seconds: 8, say: "Стенд переходит на выпуск, заметки о выпуске появляются в Confluence." }
      - { clip: released-2-pm, seconds: 6, say: "Задачи получают отметку выпуска." }
      - { clip: daily-chat, from: 0, seconds: 9, say: "Менеджер проекта спрашивает дейли: что сделали агенты и что ждёт людей." }
      - { clip: account-chat, seconds: 9, say: "Учёт показывает попытки, время агентов и стоимость каждой задачи." }
      - { slide: tools, seconds: 16, say: "Инструменты сменные. Фабрика работает с ними через порты: трекер, хостинг кода, задания агентов, чат, вики, макеты и сбои. Трекер и хостинг кода уже работают и на Forgejo, другой инструмент подключается новым адаптером. Стек самого проекта выбирает команда: команды проверок, правила и роли фабрика берёт из его репозитория." }

