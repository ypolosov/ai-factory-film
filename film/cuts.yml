# Нарезки одного журнала дубля (src/cuts.ts, src/release.ts): кому ролик, из каких клипов, сколько
# секунд и что говорит голос (он же субтитры). Клип - имя файла журнала без .webm: шаг-номер-участник
# или шаг-chat. from - с какой секунды клипа (по умолчанию первый клип шага с главой - после карточки
# главы); seconds - сколько показывать, голос длиннее - последний кадр держится.
# Правка нарезок - перевыпуск из журнала без нового дубля (scripts/demo-release.sh).
voice: ru-RU-SvetlanaNeural

cuts:
  investor:
    title: Фабрика ПО на ИИ - от требования до выкладки
    audience: для инвестора
    max: 180
    intro_say: Фабрика ПО на ИИ ведёт изменение от требования до выкладки. Все роли здесь играют ИИ-персонажи, работу фабрики делает ИИ вживую.
    parts:
      - { clip: librarian-chat, seconds: 11, say: "Команда спрашивает фабрику прямо в чате. Библиотекарь отвечает по знаниям проекта и называет источники." }
      - { clip: story-2-po, seconds: 10, say: "Продакт пишет требование в Confluence. Сверщик фабрики сам находит противоречие с архитектурным решением." }
      - { clip: adr-1-architect, seconds: 10, say: "Архитектор уточняет решение и добавляет правило-страж. Право менять настройки фабрики даёт реестр ролей." }
      - { clip: slice-chat, seconds: 9, say: "Фабрика нарезает требование на задачи с оценками, продакт утверждает нарезку." }
      - { clip: agent-2-backend, seconds: 11, say: "Агент фабрики пишет код и тесты на своём раннере. Страж, сканеры и тест до кода проверяют каждый PR." }
      - { clip: judge-1-backend, seconds: 9, say: "Вторая модель другого семейства судит изменение и пишет замечания." }
      - { clip: guard-1-backend, seconds: 9, say: "Правило из решения архитектора не пускает случайность в обход зерна. Вердикт красный, такой PR не слить." }
      - { clip: stand-3-po, seconds: 8, say: "Изменение выложено на стенд. Невостребованный приз разыгрывается заново." }
      - { clip: crash-3-devops, seconds: 8, say: "Сбой на стенде сам становится багом с местом ошибки." }
      - { clip: bugfix-merge-1-devops, seconds: 8, say: "Агент исправляет баг, а после выкладки баг и сбой закрываются сами." }
      - { clip: impostor-chat, seconds: 8, say: "Самозванец без учётки пытается выложить релиз. Фабрика отказывает по реестру ролей." }
      - { clip: released-1-devops, seconds: 8, say: "Выпуск - заметки собраны из работы этого прогона." }
      - { clip: account-chat, seconds: 8, say: "Учёт показывает время агентов и стоимость каждой задачи." }

  teaser:
    title: Фабрика ПО на ИИ
    audience: тизер
    max: 60
    intro: false
    outro: false
    parts:
      - { clip: librarian-chat, seconds: 8, say: "Фабрика ПО на ИИ. Команда из ИИ-персонажей ведёт изменение от требования до выкладки." }
      - { clip: story-2-po, seconds: 7, say: "Сверщик находит противоречие в требовании ещё до кода." }
      - { clip: agent-2-backend, seconds: 8, say: "Агент пишет код и тесты, страж и судья проверяют каждый PR." }
      - { clip: guard-1-backend, seconds: 7, say: "Решения архитектора работают как правила-стражи." }
      - { clip: stand-3-po, seconds: 7, say: "Изменение сразу на стенде." }
      - { clip: released-1-devops, seconds: 8, say: "Выпуск, заметки и учёт - без ручной работы." }

  b2c:
    title: Идея - и готовый продукт
    audience: для тех, кто делает продукт один
    max: 90
    outro: false
    intro_say: Одна идея - и фабрика ПО на ИИ доводит её до работающего продукта.
    parts:
      - { clip: story-1-po, seconds: 9, say: "Вы описываете, что нужно, обычным текстом." }
      - { clip: slice-chat, seconds: 9, say: "Фабрика сама разбивает работу на задачи с оценками." }
      - { clip: agent-2-backend, seconds: 10, say: "ИИ-агенты пишут код и тесты, а проверки фабрики не пропускают ошибки." }
      - { clip: stand-3-po, seconds: 9, say: "Готовое изменение сразу на стенде - его можно пробовать." }
      - { clip: bugfix-merge-1-devops, seconds: 9, say: "Сбои ловятся и исправляются сами." }
      - { clip: account-chat, seconds: 9, say: "А учёт показывает, во что обошлась каждая задача." }

  b2b-po:
    title: Продакт-оунер на фабрике ПО на ИИ
    audience: для команд разработки - роль продакта
    max: 90
    outro: false
    intro_say: Продакт-оунер на фабрике ПО на ИИ.
    parts:
      - { clip: story-1-po, seconds: 9, say: "Продакт пишет стори в Confluence, фабрика сама заводит её в Jira." }
      - { clip: story-2-po, seconds: 10, say: "Сверщик сравнивает стори со знаниями проекта и находит противоречия." }
      - { clip: adr-merge-1-po, seconds: 9, say: "После решения архитектора противоречие снимается само." }
      - { clip: slice-chat, seconds: 9, say: "Нарезка на задачи предлагается за минуты," }
      - { clip: approve-chat, seconds: 8, say: "а утверждает её продакт - решение остаётся за ролью." }
      - { clip: stand-3-po, seconds: 8, say: "Результат на стенде - его можно проверить сразу." }

  b2b-architect:
    title: Архитектор на фабрике ПО на ИИ
    audience: для команд разработки - роль архитектора
    max: 90
    outro: false
    intro_say: Архитектор на фабрике ПО на ИИ.
    parts:
      - { clip: story-2-po, seconds: 9, say: "Фабрика сама находит, где требование спорит с архитектурным решением." }
      - { clip: adr-1-architect, seconds: 11, say: "Архитектор уточняет решение и добавляет правило-страж. Право на это даёт реестр ролей." }
      - { clip: guard-1-backend, seconds: 10, say: "Правило-страж краснит любой PR, который нарушает решение." }
      - { clip: rules-chat, seconds: 8, say: "Архитектор просит фабрику найти повторяющиеся замечания" }
      - { clip: rules-1-architect, seconds: 10, say: "и получает правило-кандидат - строку в AGENTS.md и проверку. Утверждает архитектор." }

  b2b-developer:
    title: Разработчик на фабрике ПО на ИИ
    audience: для команд разработки - роль разработчика
    max: 90
    outro: false
    intro_say: Разработчик на фабрике ПО на ИИ.
    parts:
      - { clip: spec-1-backend, seconds: 10, say: "Сначала - спецификация изменения, утверждённая слиянием." }
      - { clip: agent-1-backend, seconds: 9, say: "Задачу берёт агент фабрики на своём раннере." }
      - { clip: agent-2-backend, seconds: 10, say: "PR агента приходит с вердиктом стража, сканерами и тестом до кода." }
      - { clip: judge-1-backend, seconds: 10, say: "Судья - модель другого семейства - пишет замечания по делу." }
      - { clip: frontend-rework-1-frontend, seconds: 10, say: "Замечание в PR - и агент дорабатывает свою ветку." }
      - { clip: bugfix-1-backend, seconds: 9, say: "Баг из сбоя агент исправляет так же." }

  b2b-qa:
    title: Тестировщик на фабрике ПО на ИИ
    audience: для команд разработки - роль QA
    max: 90
    outro: false
    intro_say: Тестировщик на фабрике ПО на ИИ.
    parts:
      - { clip: ci-chat, seconds: 10, say: "QA перезапускает проверки командой в чате, итог приходит туда же." }
      - { clip: e2e-chat, seconds: 9, say: "Сквозные проверки идут на стенде, с того коммита, что выложен." }
      - { clip: stand-2-po, seconds: 7, say: "API повтора держит правило подтверждения приза," }
      - { clip: stand-3-po, seconds: 8, say: "а через четыре дня приз разыгрывается заново - часы стенда сдвигаются." }
      - { clip: crash-2-devops, seconds: 7, say: "Сбой на стенде ловит GlitchTip," }
      - { clip: crash-3-devops, seconds: 9, say: "и фабрика сама заводит баг с местом ошибки." }

  b2b-devops:
    title: DevOps на фабрике ПО на ИИ
    audience: для команд разработки - роль DevOps
    max: 90
    outro: false
    intro_say: DevOps на фабрике ПО на ИИ.
    parts:
      - { clip: notes-chat, seconds: 10, say: "Заметки о выпуске фабрика собирает из коммитов, PR и задач." }
      - { clip: impostor-chat, seconds: 9, say: "Выложить релиз может только роль из реестра - самозванцу отказано." }
      - { clip: deploy-chat, seconds: 8, say: "DevOps подтверждает выкладку," }
      - { clip: released-1-devops, seconds: 9, say: "и выпуск появляется в Confluence." }
      - { clip: crash-3-devops, seconds: 9, say: "Сбои стенда сразу становятся багами," }
      - { clip: bugfix-merge-1-devops, seconds: 9, say: "а после исправления закрываются сами." }
